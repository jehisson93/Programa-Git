<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGI - Reportes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="reportes">
  <main class="container wide">
    <div class="topbar"><p class="brand">SGI</p><a class="back-link" href="menu-principal.html">Volver al menú</a></div>
    <section class="card" aria-labelledby="tituloReportes">
      <h1 id="tituloReportes">Generar reportes</h1>
      <form id="formReporte" class="filters">
        <div class="form-grid three">
          <div><label class="required" for="tipoReporte">Tipo de reporte</label><select id="tipoReporte" required><option>Inventario</option><option>Movimientos</option><option>Ajustes</option></select></div>
          <div><label for="fechaInicio">Fecha inicial</label><input id="fechaInicio" type="date"></div>
          <div><label for="fechaFin">Fecha final</label><input id="fechaFin" type="date"></div>
          <div><label for="reporteProducto">Producto</label><select id="reporteProducto"></select></div>
        </div>
        <div class="buttons">
          <button class="primary" type="submit">Generar</button>
          <button id="btnImprimir" class="secondary" type="button">Imprimir / Guardar PDF</button>
          <button id="btnExportarCsv" class="secondary" type="button">Exportar CSV</button>
        </div>
      </form>
      <p id="mensajeReporte" class="message success" role="status" hidden></p>
      <section id="vistaReporte" class="preview-box" aria-live="polite"></section>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
