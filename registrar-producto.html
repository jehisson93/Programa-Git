<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGI - Registrar producto</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="registrarProducto">
  <main class="container narrow">
    <div class="topbar"><p class="brand">SGI</p><a class="back-link" href="menu-principal.html">Volver al menú</a></div>
    <section class="card" aria-labelledby="tituloProducto">
      <h1 id="tituloProducto">Registrar producto</h1>
      <p class="subtitle">Ingrese la información básica del producto.</p>
      <form id="formProducto">
        <div class="form-grid two">
          <div><label class="required" for="codigo">Código</label><input id="codigo" name="codigo" type="text" required maxlength="15" pattern="[A-Za-z0-9-]+" title="Use letras, números o guiones"></div>
          <div><label class="required" for="nombre">Nombre</label><input id="nombre" name="nombre" type="text" required maxlength="80"></div>
          <div class="field-full"><label for="descripcion">Descripción</label><textarea id="descripcion" name="descripcion" rows="3" maxlength="250"></textarea></div>
          <div><label class="required" for="categoria">Categoría</label><select id="categoria" name="categoria" required><option value="">Seleccionar</option><option>Electrónica</option><option>Papelería</option><option>Mobiliario</option><option>Otros</option></select></div>
          <div><label class="required" for="unidad">Unidad de medida</label><input id="unidad" name="unidad" type="text" placeholder="Ejemplo: Unidad" required maxlength="30"></div>
          <div><label class="required" for="stockActual">Stock actual</label><input id="stockActual" name="stockActual" type="number" min="0" value="0" required></div>
          <div><label class="required" for="stockMinimo">Stock mínimo</label><input id="stockMinimo" name="stockMinimo" type="number" min="0" value="0" required></div>
          <div><label class="required" for="precio">Precio unitario (COP)</label><input id="precio" name="precio" type="number" min="0" step="100" value="0" required></div>
          <div><label class="required" for="estado">Estado</label><select id="estado" name="estado" required><option value="">Seleccionar</option><option>Activo</option><option>Inactivo</option></select></div>
        </div>
        <p id="mensajeProducto" class="message success" role="status" hidden></p>
        <div class="buttons"><button class="primary" type="submit">Guardar producto</button><button class="secondary" type="reset">Limpiar</button></div>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
