<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGI - Consultar productos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="consultar">
  <main class="container wide">
    <div class="topbar"><p class="brand">SGI</p><a class="back-link" href="menu-principal.html">Volver al menú</a></div>
    <section class="card" aria-labelledby="tituloConsulta">
      <h1 id="tituloConsulta">Consultar productos</h1>
      <form id="formConsulta" class="filters">
        <div class="form-grid three">
          <div><label for="buscarProducto">Nombre o código</label><input id="buscarProducto" type="search" placeholder="Ejemplo: PROD001"></div>
          <div><label for="filtroCategoria">Categoría</label><select id="filtroCategoria"><option value="">Todas</option><option>Electrónica</option><option>Papelería</option><option>Mobiliario</option><option>Otros</option></select></div>
          <div><label for="filtroEstado">Estado</label><select id="filtroEstado"><option value="">Todos</option><option>Activo</option><option>Inactivo</option></select></div>
        </div>
        <div class="buttons"><button class="primary" type="submit">Consultar</button><button id="btnLimpiarConsulta" class="secondary" type="button">Limpiar filtros</button></div>
      </form>
      <p id="cantidadResultados" class="results-count" aria-live="polite"></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Código</th><th>Nombre</th><th>Categoría</th><th>Stock actual</th><th>Stock mínimo</th><th>Precio</th><th>Estado</th><th>Acción</th></tr></thead>
          <tbody id="tablaProductos"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
